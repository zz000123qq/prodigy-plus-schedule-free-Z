[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# setup.py remains the source of truth for the metadata so that existing
# `python setup.py` style invocations keep working. Only packaging config lives
# here.
[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["prodigyplus*"]
exclude = ["tools*", "docs*"]
